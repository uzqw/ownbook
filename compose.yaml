services:
  ownbook:
    image: ${DOCKER_IMAGE:-ownbook:local}
    user: '${APP_UID:-${HOST_UID:-1000}}:${APP_GID:-${HOST_GID:-1000}}'
    # Host publishing stays off: the platform Caddy route on host 18094 owns
    # that port and reverse-proxies to this service over cicd-observability.
    # ports:
    #   - '${DOCKER_HOST_PORT:-18094}:18093'
    volumes:
      - ${DOCKER_PB_DATA_PATH:-${XDG_DATA_HOME:-${HOME}/.local/share}/uzqw/apps/ebook-reader/pb_data}:/app/pb_data
      - ${DOCKER_BUILDER_CACHE_PATH:-${XDG_DATA_HOME:-${HOME}/.local/share}/uzqw/apps/ownbook/docker-build-cache}:/pi-build-cache
    environment:
      TZ: ${TZ:-${HOST_TZ:-UTC}}
      POCKETBASE_HOST: 0.0.0.0
      POCKETBASE_PORT: 18093
      POCKETBASE_DATA_DIR: /app/pb_data
      PUBLIC_DIR: /app/dist
      TMPDIR: /app/pb_data/tmp
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:-admin@e.co}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:-admin123}
      APP_USER_NAME: ${APP_USER_NAME:-Reader Demo User}
      APP_USER_EMAIL: ${APP_USER_EMAIL:-demo@e.co}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-demo1234}
      EPUB_RENDER_FONT: /app/fonts/DroidSansFallback.ttf
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:18093/api/health >/dev/null']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
